{% extends "auth_base.html" %}
{% block title %}Resend verification email{% endblock %}

{% block heading %}
<h1 class="login_title">Resend the verification link</h1>
<p class="login_subtitle">Enter the email you signed up with and we'll send a fresh link. Check your spam folder too.</p>
{% endblock %}

{% block content %}
<form action="{{ url_for('resend_verification') }}" method="post" class="login_form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login_group">
        <div class="login_box">
            <input type="email" name="email" autocomplete="email" required placeholder=" " value="{{ email or '' }}" class="login_input" id="email">
            <label for="email" class="login_label">Email</label>
            <i class="ri-mail-fill login_icon" aria-hidden="true"></i>
        </div>
    </div>
    <button type="submit" class="login_button">Send link</button>
    <p class="login_sign"><a href="{{ url_for('login') }}">← Back to login</a></p>
</form>
{% endblock %}
