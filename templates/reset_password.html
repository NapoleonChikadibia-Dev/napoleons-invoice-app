{% extends "auth_base.html" %}
{% block title %}Set a new password{% endblock %}

{% block heading %}
<h1 class="login_title">Set a new password</h1>
<p class="login_subtitle">This replaces your old password. Use it the next time you log in.</p>
{% endblock %}

{% block content %}
<form action="{{ url_for('reset_password', token=token) }}" method="post" class="login_form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login_group">
        <div class="login_box">
            <input type="password" name="password" autocomplete="new-password" class="login_input" required minlength="8" placeholder=" " id="password">
            <label for="password" class="login_label">New password</label>
            <i class="ri-lock-2-fill login_icon" aria-hidden="true"></i>
        </div>
        <div class="login_box">
            <input type="password" name="confirm_password" autocomplete="new-password" class="login_input" required minlength="8" placeholder=" " id="confirm_password" data-match="password">
            <label for="confirm_password" class="login_label">Type it again</label>
            <i class="ri-lock-2-fill login_icon" aria-hidden="true"></i>
        </div>
        <p class="field-hint">At least 8 characters.</p>
    </div>
    <button type="submit" class="login_button">Save new password</button>
</form>
{% endblock %}
